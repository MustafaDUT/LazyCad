# Lazy CAD — statik site sunumu. index.html üzerinden SPA fallback + hashlı asset önbelleği.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # Vite hashlı asset'ler (dist/assets/*) — immutable, uzun önbellek
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Geri kalan her yol index.html'e düşer (derin link / yenileme güvenliği)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
